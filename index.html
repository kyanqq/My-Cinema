<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0e"><meta name="description" content="MY CINEMA — моя кинотека"><link rel="manifest" href="./manifest.webmanifest"><title>MY CINEMA</title><style>
:root{color-scheme:dark;--bg:#0b0b0e;--panel:#17171c;--gold:#dfb982;--muted:#aaa7a7}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:#f6f0e8}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at top,#44301c3d,transparent 50%)}main{position:relative;max-width:1000px;margin:auto;padding:27px 18px 110px}.brand{font-family:Georgia,serif;letter-spacing:.18em;color:var(--gold);font-size:13px}.hero{padding:46px 0 29px}.hero h1{font:normal clamp(42px,10vw,78px) Georgia,serif;line-height:.98;letter-spacing:-.045em;margin:10px 0}.hero p{color:var(--muted);font-size:14px}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:.2em;text-transform:uppercase}.stats{display:flex;gap:12px;margin:23px 0 30px}.stat{background:#ffffff08;border:1px solid #ffffff16;border-radius:15px;padding:16px 20px;min-width:130px}.stat strong{display:block;font:28px Georgia,serif;color:var(--gold)}.stat small{color:var(--muted)}.tools{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:23px}input,select,button,textarea{font:inherit}input,select{background:#1b1b20;border:1px solid #454044;color:white;padding:13px 14px;border-radius:12px}input{flex:1;min-width:180px}button{cursor:pointer}.pill{background:#28252a;color:#ebd4b3;border:1px solid #554330;padding:11px 14px;border-radius:12px}.pill.active{background:#bb9161;color:#15110c}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}.movie{cursor:pointer;animation:rise .45s both}.poster{position:relative;aspect-ratio:2/3;background:#262027;border-radius:12px;overflow:hidden;box-shadow:0 12px 25px #0007}.poster img{width:100%;height:100%;object-fit:cover;transition:transform .35s}.movie:hover img{transform:scale(1.045)}.poster .score{position:absolute;bottom:10px;right:10px;border-radius:8px;background:#111d;padding:6px 8px;font-weight:700;color:#ffe1a2;backdrop-filter:blur(9px)}.movie h3{font-size:14px;margin:11px 0 3px;line-height:1.35}.movie p{font-size:12px;margin:0;color:var(--muted)}.empty{padding:50px;text-align:center;color:var(--muted)}dialog{background:#161519;color:#faf5eb;border:1px solid #5c4b36;border-radius:22px;width:min(94%,570px);max-height:90dvh;padding:0;box-shadow:0 20px 80px #000e}dialog::backdrop{background:#000b;backdrop-filter:blur(8px)}.detail{padding:24px}.detail h2{font:33px Georgia,serif;margin:5px 0}.detail p{line-height:1.65;color:#d2ccd0}.detail .meta{color:var(--gold);font-size:13px}.close{float:right;background:#353036;color:white;border:0;border-radius:50%;width:36px;height:36px;font-size:20px}.detail label{display:block;margin:20px 0 8px;color:var(--gold);font-size:13px}.detail select,.detail textarea{width:100%;background:#252328;border:1px solid #554b48;color:white;border-radius:9px;padding:12px}.detail textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.actions button{padding:12px 14px;border-radius:11px;background:#272329;border:1px solid #725a41;color:#f6d1a2}footer{padding:50px 0 10px;color:#8b8586;font-size:12px}a{color:var(--gold)}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style></head><body><main><div class="brand">✦ MY CINEMA</div><header class="hero"><span class="eyebrow">Личный киноархив</span><h1>Каждый фильм —<br>целая история.</h1><p>Коллекция просмотренного. Сохраняй впечатления.</p></header><section class="stats"><div class="stat"><strong id="total">0</strong><small>фильмов</small></div><div class="stat"><strong id="favCount">0</strong><small>избранных</small></div></section><section class="tools"><input id="search" placeholder="⌕  Найти фильм..." aria-label="Найти фильм"><select id="sort" aria-label="Сортировка"><option value="num">По порядку</option><option value="year">По году</option><option value="imdb">По IMDb</option><option value="title">По названию</option></select><button class="pill" id="favorites">♡ Избранное</button></section><div class="grid" id="grid"></div><footer>MY CINEMA · <button class="pill" id="export">Экспорт моих оценок</button> <button class="pill" id="import">Импорт оценок</button><input type="file" id="backup" accept=".json,application/json" hidden></footer></main><dialog id="modal"><div class="detail"><button class="close" id="close" aria-label="Закрыть">×</button><div class="eyebrow" id="mnum"></div><h2 id="mtitle"></h2><div class="meta" id="mmeta"></div><p id="mdesc"></p><label for="rating">Моя оценка</label><select id="rating"><option value="">Без оценки</option></select><label for="notes">Мои впечатления</label><textarea id="notes" placeholder="О чём хочется помнить?"></textarea><div class="actions"><button id="favBtn">♡ В избранное</button><button id="share">Поделиться ↗</button></div></div></dialog><script src="./movies.js"></script><script>
const films=window.MY_CINEMA_FILMS||[];const $=id=>document.getElementById(id);let state={};try{state=JSON.parse(localStorage.getItem('myCinemaV4')||'{}')}catch{}let selected=null,onlyFav=false;const save=()=>localStorage.setItem('myCinemaV4',JSON.stringify(state));const get=id=>state[id]||{};const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let q=$('search').value.toLocaleLowerCase('ru');let items=films.filter(f=>(f.title+' '+f.original+' '+f.year).toLocaleLowerCase('ru').includes(q)&&(!onlyFav||get(f.id).fav));let sort=$('sort').value;items.sort((a,b)=>sort==='year'?b.year-a.year:sort==='imdb'?b.imdb-a.imdb:sort==='title'?a.title.localeCompare(b.title,'ru'):a.num-b.num);$('total').textContent=films.length;$('favCount').textContent=films.filter(f=>get(f.id).fav).length;$('grid').innerHTML=items.length?items.map(f=>'<article class="movie" tabindex="0" role="button" data-id="'+safe(f.id)+'"><div class="poster"><img loading="lazy" alt="Постер: '+safe(f.title)+'" src="'+safe(f.poster)+'" onerror="if(!this.dataset.failed){this.dataset.failed=1;this.src=this.dataset.fallback}" data-fallback="'+safe(f.posterFallback)+'"><span class="score">★ '+safe(f.imdb)+'</span></div><h3>'+safe(f.title)+(get(f.id).fav?' ♥':'')+'</h3><p>'+safe(f.original)+' · '+safe(f.year)+'</p></article>').join(''):'<p class="empty">Здесь пока нет фильмов</p>';document.querySelectorAll('.movie').forEach(el=>{el.onclick=()=>openFilm(el.dataset.id);el.onkeydown=e=>{if(e.key==='Enter')openFilm(el.dataset.id)}})}function openFilm(id){selected=films.find(f=>f.id===id);if(!selected)return;$('mnum').textContent='ФИЛЬМ № '+selected.num;$('mtitle').textContent=selected.title;$('mmeta').textContent=[selected.original,selected.year,selected.director,'IMDb ★ '+selected.imdb].join(' · ');$('mdesc').textContent=selected.description;$('rating').value=get(id).rating||'';$('notes').value=get(id).notes||'';$('favBtn').textContent=get(id).fav?'♥ В избранном':'♡ В избранное';$('modal').showModal()}for(let n=10;n>=1;n--){let o=document.createElement('option');o.value=n;o.textContent=n+'/10';$('rating').append(o)}$('close').onclick=()=>$('modal').close();$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').close()};$('rating').onchange=e=>{if(!selected)return;state[selected.id]={...get(selected.id),rating:e.target.value};save()};$('notes').oninput=e=>{if(!selected)return;state[selected.id]={...get(selected.id),notes:e.target.value};save()};$('favBtn').onclick=()=>{if(!selected)return;state[selected.id]={...get(selected.id),fav:!get(selected.id).fav};save();$('favBtn').textContent=get(selected.id).fav?'♥ В избранном':'♡ В избранное';render()};$('share').onclick=async()=>{if(!selected)return;const data={title:selected.title,text:selected.title+' ('+selected.year+') — MY CINEMA',url:location.href};if(navigator.share)try{await navigator.share(data)}catch{}else if(navigator.clipboard){await navigator.clipboard.writeText(data.text+' '+data.url);alert('Ссылка скопирована')}};$('search').oninput=render;$('sort').onchange=render;$('favorites').onclick=()=>{onlyFav=!onlyFav;$('favorites').classList.toggle('active',onlyFav);render()};$('export').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-cinema-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('backup').click();$('backup').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!data||typeof data!=='object'||Array.isArray(data))throw Error();state=data;save();render();alert('Данные импортированы')}catch{alert('Не удалось прочитать файл')}};render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
