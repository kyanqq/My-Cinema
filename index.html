const films=window.MY_CINEMA_FILMS||[];const $=id=>document.getElementById(id);let state={};try{state=JSON.parse(localStorage.getItem('myCinemaV4')||'{}')}catch{}let selected=null,onlyFav=false;const save=()=>{for(const item of Object.values(state)){if(item&&typeof item==='object')delete item.rating}localStorage.setItem('myCinemaV4',JSON.stringify(state))};const get=id=>{const {rating,...rest}=state[id]||{};return rest};const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let q=$('search').value.toLocaleLowerCase('ru');let items=films.filter(f=>(f.title+' '+f.original+' '+f.year).toLocaleLowerCase('ru').includes(q)&&(!onlyFav||get(f.id).fav));let sort=$('sort').value;items.sort((a,b)=>sort==='year'?b.year-a.year:sort==='imdb'?b.imdb-a.imdb:sort==='title'?a.title.localeCompare(b.title,'ru'):a.num-b.num);$('total').textContent=films.length;$('favCount').textContent=films.filter(f=>get(f.id).fav).length;$('grid').innerHTML=items.length?items.map((f,i)=>'<article class="movie" style="--delay:'+Math.min(i*55,360)+'ms" tabindex="0" role="button" data-id="'+safe(f.id)+'"><div class="poster"><img loading="lazy" alt="Постер: '+safe(f.title)+'" src="'+safe(f.poster)+'" onerror="if(!this.dataset.failed){this.dataset.failed=1;this.src=this.dataset.fallback}" data-fallback="'+safe(f.posterFallback)+'"><span class="score">★ '+safe(f.imdb)+'</span></div><h3>'+safe(f.title)+(get(f.id).fav?' ♥':'')+'</h3><p>'+safe(f.original)+' · '+safe(f.year)+'</p></article>').join(''):'<p class="empty">Здесь пока нет фильмов</p>';document.querySelectorAll('.poster img').forEach(img=>{if(img.complete)img.classList.add('loaded')});document.querySelectorAll('.movie').forEach(el=>{el.onclick=()=>openFilm(el.dataset.id);el.onkeydown=e=>{if(e.key==='Enter')openFilm(el.dataset.id)}})}function openFilm(id){
