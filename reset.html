<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="cache-control" content="no-store"><title>MY CINEMA — Обновление</title><style>body{margin:0;background:#0b0b0e;color:#f8ead6;font-family:system-ui;min-height:100dvh;display:grid;place-items:center;text-align:center}main{max-width:400px;padding:24px}h1{font:37px Georgia,serif;color:#dfb982}p{line-height:1.6;color:#ccc}a{color:#15110c;background:#dfb982;padding:15px 20px;border-radius:12px;display:inline-block;text-decoration:none;font-weight:700}</style></head><body><main><h1>MY CINEMA</h1><p id="status">Обновляем кинотеку и очищаем старую версию…</p><a id="go" href="./index.html?version=42">Открыть новую версию</a></main><script>(async()=>{try{if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('mycinema-')).map(k=>caches.delete(k)))}}catch(e){}document.getElementById('status').textContent='Готово. Открываем свежую версию…';setTimeout(()=>location.replace('./index.html?version=42&fresh='+Date.now()),700)})();</script></body></html>
